{% load static %}
<header class="page-hero{% if hero_image %} page-hero--image{% endif %}{% if hero_key %} page-hero--{{ hero_key }}{% endif %}">
    {% if hero_image %}
        <img src="{% static hero_image %}" alt="" class="page-hero-background" decoding="async" fetchpriority="high">
        <div class="page-hero-overlay" aria-hidden="true"></div>
    {% endif %}
    <div class="container">
        <div class="row justify-content-center text-center">
            <div class="col-lg-8 reveal">
                {% if eyebrow %}<span class="eyebrow">{{ eyebrow }}</span>{% endif %}
                <h1>{{ heading }}</h1>
                {% if intro %}<p>{{ intro }}</p>{% endif %}
            </div>
        </div>
    </div>
</header>
